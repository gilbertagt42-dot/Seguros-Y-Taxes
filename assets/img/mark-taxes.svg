<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Alex Taxes Preparer">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18303F"/>
      <stop offset=".55" stop-color="#0B1B26"/>
      <stop offset="1" stop-color="#050D14"/>
    </linearGradient>
    <linearGradient id="oro" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#FFF0C4"/>
      <stop offset=".38" stop-color="#F7CE72"/>
      <stop offset=".72" stop-color="#D9A93F"/>
      <stop offset="1" stop-color="#9C6E14"/>
    </linearGradient>
    <radialGradient id="brillo" cx=".78" cy=".16" r=".7">
      <stop offset="0" stop-color="#D9A93F" stop-opacity=".85"/>
      <stop offset="1" stop-color="#D9A93F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#fondo)"/>
  <rect width="64" height="64" rx="16" fill="url(#brillo)"/>
  <rect x="1.2" y="1.2" width="61.6" height="61.6" rx="15" fill="none" stroke="url(#oro)" stroke-opacity=".55" stroke-width="1.4"/>

  <!-- Calculadora -->
  <rect x="12" y="15" width="17" height="24" rx="3.4" fill="#0A1219" stroke="#C9962E" stroke-opacity=".55" stroke-width="1.2"/>
  <rect x="15" y="18.4" width="11" height="5.4" rx="1.4" fill="url(#oro)" opacity=".85"/>
  <g fill="url(#oro)" opacity=".8">
    <rect x="15" y="26.2" width="3.2" height="3.2" rx="1"/>
    <rect x="19.4" y="26.2" width="3.2" height="3.2" rx="1"/>
    <rect x="23.8" y="26.2" width="3.2" height="3.2" rx="1"/>
    <rect x="15" y="31.2" width="3.2" height="3.2" rx="1"/>
    <rect x="19.4" y="31.2" width="3.2" height="3.2" rx="1"/>
    <rect x="23.8" y="31.2" width="3.2" height="3.2" rx="1"/>
  </g>

  <!-- Signo de dólar -->
  <g transform="translate(34 12)">
    <text x="0" y="30" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="700" fill="url(#oro)" letter-spacing="-1">$</text>
  </g>

  <!-- Línea base -->
  <path d="M14 47h36" stroke="url(#oro)" stroke-width="2.2" stroke-linecap="round" opacity=".75"/>
</svg>
