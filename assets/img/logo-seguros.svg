  <path d="M36 10.2 61 18.8v24c0 13.9-10.6 24.2-25 28.2-14.4-4-25-14.3-25-28.2v-24Z"
        fill="#fff" opacity=".72"/>

  <!-- Persona protegida -->
  <g fill="none" stroke="url(#azul)" stroke-width="3.4" stroke-linecap="round">
    <path d="M26.6 42.4 20.8 35"/>
    <path d="M40.4 42.4 46.2 35"/>
  </g>
  <circle cx="33.5" cy="31.4" r="5.4" fill="url(#azul)"/>
  <path d="M25.2 51.4c0-5.3 3.7-8.6 8.3-8.6s8.3 3.3 8.3 8.6v3.2H25.2Z" fill="url(#azul)"/>

  <!-- Hoja de crecimiento -->
  <path d="M46.6 45.6c7.6-2.6 13.4 2.4 12.2 11.6-7.4 2.4-13.4-2.6-12.2-11.6Z"
