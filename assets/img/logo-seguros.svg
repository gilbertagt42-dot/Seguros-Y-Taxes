<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 80" role="img" aria-label="Escudo de protección">
  <defs>
    <linearGradient id="azul" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#59A9FF"/>
      <stop offset=".45" stop-color="#0B5FD0"/>
      <stop offset="1" stop-color="#063A84"/>
    </linearGradient>
    <linearGradient id="plata" x1=".1" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".48" stop-color="#E6EEF7"/>
      <stop offset="1" stop-color="#B9CADB"/>
    </linearGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7DDA0"/>
      <stop offset="1" stop-color="#C9962E"/>
    </linearGradient>
  </defs>

  <!-- Escudo -->
  <path d="M36 2.5 68 13.6v29.6c0 17.6-13.6 30.2-32 34.8-18.4-4.6-32-17.2-32-34.8V13.6Z"
