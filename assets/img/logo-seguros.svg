  <path d="M47.4 56.4c2.8-4 6.2-6.4 10.2-8.2" stroke="#8A6212" stroke-width="1.5" fill="none" stroke-linecap="round" opacity=".55"/>

  <!-- Base dorada -->
  <path d="M20 64.4h26" stroke="url(#oro)" stroke-width="3.6" stroke-linecap="round" opacity=".9"/>
</svg>
